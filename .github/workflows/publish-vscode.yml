name: Publish VS Code extension

# The marketplace listing is a discovery surface, so it should never drift from
# a release. Tagging publishes it; workflow_dispatch publishes on demand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm run build

      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --no-dependencies -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Open VSX covers Cursor, Windsurf and VSCodium. Skipped until the token exists.
      - name: Publish to Open VSX
        if: ${{ secrets.OVSX_TOKEN != '' }}
        run: npx ovsx publish --packagePath *.vsix -p "$OVSX_TOKEN"
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
